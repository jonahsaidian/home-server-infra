services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    networks:
      - default
      - edge
    restart: unless-stopped

  farsi-transcriber:
    image: ghcr.io/jonahsaidian/farsitotext:latest
    expose:
      - "8501"
    restart: unless-stopped

  immich-demo:
    image: nginx:alpine
    volumes:
      - /home/jonah/immich-demo:/usr/share/nginx/html:ro
      - /home/jonah/home-server-infra/immich-demo/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    restart: unless-stopped

  # app2:
  #   image: ghcr.io/jonahsaidian/app2:latest
  #   expose:
  #     - "8502"
  #   restart: unless-stopped

networks:
  edge:
    external: true
