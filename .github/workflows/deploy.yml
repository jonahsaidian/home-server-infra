name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't git-clean: .env, cloudflared/config.yml, and
          # cloudflared/credentials.json are gitignored and live only in
          # this runner's working copy (placed there once during setup).
          clean: false

      - name: Deploy stack
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
