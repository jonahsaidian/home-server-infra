# immich-demo: static demo page.
# Jonah swaps photo files in place and expects them to show up immediately,
# so send Cache-Control: no-cache: browsers and Cloudflare must revalidate
# with the origin on every visit (cheap 304 when nothing changed).
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    add_header Cache-Control "no-cache" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
